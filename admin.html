<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nestora Admin</title><link rel="stylesheet" href="style.css"></head><body class="adminPage"><header><div class="brand"><div class="logoMark">N</div><div><h1>Nestora</h1><small>ADMIN PANEL</small></div></div><a class="adminLink" href="index.html">View Site</a></header><main class="adminMain"><div id="loginBox" class="panel"><span class="eyebrow">ADMIN ACCESS</span><h2>Admin Login</h2><p class="muted">Enter the admin password to continue.</p><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button id="loginBtn" class="primary">Login</button><div id="loginMsg" class="msg"></div></div><div id="dashboard" class="hidden"><div class="adminTop"><div><span class="eyebrow">CONTROL CENTER</span><h2>Manage Nestora</h2></div><button id="logoutBtn" class="ghost">Logout</button></div><div class="panel"><h3>Website settings</h3><label>Marquee announcement</label><input id="marqueeInput" placeholder="Announcement text"><label>WhatsApp number <small>(country code, no +)</small></label><input id="waInput" placeholder="919876543210"><button id="saveSettings" class="primary">Save settings</button><div id="settingsMsg" class="msg"></div></div><div class="panel"><div class="panelTitle"><h3>Categories</h3><span class="muted">Add as many as you need</span></div><div class="inline"><input id="catInput" placeholder="e.g. Flats"><button id="addCat" class="secondary">Add</button></div><div id="catList" class="chipList"></div></div><div class="panel"><h3>Add property</h3><div class="formGrid"><input id="pTitle" placeholder="Property title"><input id="pPrice" placeholder="Price (e.g. ₹18,000/month)"><input id="pLocation" placeholder="Location"><select id="pCategory"><option value="">Select category</option></select><textarea id="pDesc" placeholder="Full property description"></textarea><div><label>Property images</label><input id="pImages" type="file" accept="image/*" multiple><small class="muted">Uploaded to ImgBB automatically.</small><div id="uploadStatus" class="msg"></div></div></div><button id="addProperty" class="primary">Upload & Add Property</button></div><div class="panel"><div class="panelTitle"><h3>Your properties</h3><span id="count" class="muted"></span></div><div id="adminProperties" class="adminProps"></div></div></div></main><script type="module" src="admin.js"></script></body></html>
